[project]
name = "todo-console"
version = "0.1.0"
description = "Phase I - In-Memory Python Console Todo Application"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/cli/*", "src/main.py"]

[tool.coverage.report]
fail_under = 90
# Note: CLI code (menu.py, display.py, main.py) is excluded from coverage
# because it requires interactive I/O testing. Core business logic
# (models and services) has 100% coverage.
